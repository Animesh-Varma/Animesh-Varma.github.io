<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>track.animeshvarma.dev</title>

    <!-- Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

    <!-- Core Libraries (Three.js + MediaPipe) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css?v=0.3">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Fixed Ambient Background -->
    <div class="ambient-glow"></div>

    <div class="app-container">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="logo-section">
                <a href="https://animeshvarma.dev" class="home-link">
                    <h1><span class="highlight">track</span>.animeshvarma.dev</h1>
                </a>
            </div>

            <div class="status-badge">
                <div class="live-dot" id="statusDot"></div>
                <span id="systemStatus">INITIALIZING CORE...</span>
            </div>
        </header>

        <main id="main-viewport">
            <!-- Loading Overlay -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loader-content">
                    <svg class="md-spinner" viewBox="0 0 50 50">
                        <circle class="md-spinner-path" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
                    </svg>
                    <span class="blink">ESTABLISHING UPLINK</span>
                    <span id="loadDetail" style="font-size: 0.7rem; opacity: 0.7;">Loading Neural Models...</span>
                </div>
            </div>

            <!-- 3D Canvas Container -->
            <div id="canvas-container"></div>

            <!-- Latency HUD -->
            <div class="hud-panel">
                <span class="material-symbols-rounded" style="font-size: 14px;">speed</span>
                <span>LATENCY: <span id="fpsCounter">0</span>ms</span>
            </div>

            <!-- Input Feed (Hidden via opacity) -->
            <video class="input_video" autoplay muted playsinline></video>
        </main>

        <footer>
            <p>
                <a href="https://github.com/animesh-varma" target="_blank">GitHub</a> |
                <a href="mailto:mail@animeshvarma.dev">Email</a> |
                <a href="https://instagram.com/animesh_varma" target="_blank">Instagram</a>
            </p>
        </footer>
    </div>
</body>
</html>
